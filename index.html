!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Trabajos Web</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #0969da; }
        p { color: #57606a; font-size: 18px; margin-bottom: 40px; }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #2da44e;
            color: white;
            padding: 18px 30px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s;
            min-width: 200px;
        }
        .btn:hover {
            background-color: #2c974b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>Mis Trabajos de Diseño Web</h1>
    <p>Haz clic en cualquiera de los botones para ver mis proyectos en línea:</p>

    <div class="container">
        <a class="btn" href="./clase 1/">Clase 1</a>
        <a class="btn" href="./clase 2/">Clase 2</a>
        <a class="btn" href="./clase 3 grid/">Clase 3: Grid</a>
        <a class="btn" href="./publicidad Fashion clase 4/">Clase 4: Publicidad Fashion</a>
    </div>

</body>
</html>
